[package]
name = "passlock-platform"
description = "Isolation des primitives système non portables (mémoire, fichiers). Seul crate autorisé à utiliser `unsafe`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
# La surface FFI a été volontairement réduite à son minimum tant que la cible
# Windows n'était pas installée : deux appels (`MoveFileExW`, `LockFileEx`).
# La phase 4 y ajoute la **DACL restrictive** exigée pour tout fichier sensible
# neuf (clé de récupération, export en clair, sauvegarde, blobs, temporaires) —
# sans elle, ces fichiers reposeraient sur les ACL héritées du profil, ce qui
# serait une garantie silencieusement absente. Les fonctionnalités ci-dessous
# portent ces déclarations :
#   Win32_Security              SECURITY_ATTRIBUTES, ACL, descripteurs, jeton
#   Win32_Security_Authorization SetEntriesInAclW, EXPLICIT_ACCESS_W, TRUSTEE_W
#   Win32_System_Threading      OpenProcessToken, GetCurrentProcess
#   Win32_System_SystemServices SECURITY_DESCRIPTOR_REVISION
# Compilation vérifiée par `cargo check --target x86_64-pc-windows-msvc` ;
# exécution **non observée** — voir SECURITY.md, limite L9.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_IO",
    "Win32_System_Diagnostics_Debug",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
